minimumReleaseAge: 4320 # Minutes = 3 Days
minimumReleaseAgeExclude:
  - "@rimelight/*"
  - astro
  - "@astrojs/cloudflare"
  - "@astrojs/check"
  - "@astrojs/language-server"
  - "@astrojs/starlight"
  - "@astrojs/vue"
  - "@rimelight/*"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
saveExact: true
packageImportMethod: copy
strictSsl: true
overrides:
  defu: "6.1.6"
  vite: "npm:@voidzero-dev/vite-plus-core@latest"
  vitest: "npm:@voidzero-dev/vite-plus-test@latest"
  yaml: "2.8.3"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
